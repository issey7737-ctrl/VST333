name: Build VST3 (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build AutoMaster
        continue-on-error: true
        run: cmake --build build --config Release --target AutoMaster_VST3 --parallel

      - name: Build VoxChain
        continue-on-error: true
        run: cmake --build build --config Release --target VoxChain_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path build -Recurse -Filter "*.vst3" -Directory | ForEach-Object { Copy-Item -Recurse -Path $_.FullName -Destination dist/ }

      - uses: actions/upload-artifact@v4
        with:
          name: VST3-Windows
          path: dist
